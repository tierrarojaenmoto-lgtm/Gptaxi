<style>
:root{--bg:#0b1326;--lo:#060e20;--c1:#131b2e;--c2:#171f33;--c3:#222a3d;--c4:#2d3449;--ink:#dae2fd;--mut:#d3c5ac;--y:#fbbf24;--g:#45dfa4;--b:#82d2ff;--err:#ffb4ab}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);overscroll-behavior-y:contain}
body{color:var(--ink);font:400 15px/1.45 "Hanken Grotesk",system-ui,sans-serif}
h2,b,button,.st{font-family:"Space Grotesk","Hanken Grotesk",system-ui,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(6,14,32,.88);backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 8px rgba(0,0,0,.3)}
.hb{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:36px;width:36px;border-radius:10px}
.brand b{display:block;color:#ffe1a7;font-size:19px;line-height:1.1}.brand small{font:700 10px "Space Grotesk",sans-serif;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
main{max-width:560px;margin:0 auto;padding:calc(80px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
h2{font-size:18px;margin:22px 0 0}p.s{margin:8px 0;opacity:.7}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
input,select,textarea{width:100%;padding:14px;border:2px solid var(--c4);border-radius:16px;background:var(--lo);color:inherit;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--y);outline-offset:1px}
button{width:100%;margin-top:14px;padding:0 16px;height:52px;border:0;border-radius:999px;background:var(--y);color:#402d00;font-weight:700;font-size:16px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.6}
button.o{background:var(--c3);color:var(--ink);margin-top:10px}
.c{background:var(--c2);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.c b{display:block;font-size:17px}
.st{display:inline-block;background:rgba(69,223,164,.15);color:var(--g);padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.st.urgent{background:rgba(251,191,36,.18);color:var(--y)}
.price{font-size:28px!important;margin:6px 0;color:#ffe1a7}
.c a{color:var(--b);font-weight:700}
.err{color:var(--err);margin-top:10px}[hidden]{display:none!important}
.moto{font-size:28px;line-height:1}
#map{height:280px;border-radius:20px;margin-top:14px;background:var(--lo)}.leaflet-container{background:var(--lo)}
.seg,.row{display:flex;gap:8px}.row>div{flex:1}
.seg button{background:var(--c3);color:var(--ink);font-size:14px;margin-top:10px;height:48px}
.seg button[aria-pressed=true]{background:var(--y);color:#402d00}
.rt{display:flex;gap:6px}.rt button{margin-top:8px;padding:0 4px;background:var(--c3);color:var(--ink);height:46px;font-size:15px}
summary{cursor:pointer;font-weight:700}
.c.alert{background:rgba(251,191,36,.09);box-shadow:0 0 0 2px var(--y);animation:pulse 1.3s infinite}
.c.go{background:rgba(69,223,164,.12);box-shadow:0 0 0 2px var(--g);animation:pulse2 1.8s infinite}
.c b.big{font-size:22px;margin-bottom:6px}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--y),0 0 0 9px rgba(251,191,36,.2)}}
@keyframes pulse2{50%{box-shadow:0 0 0 2px var(--g),0 0 0 9px rgba(69,223,164,.2)}}
@media(prefers-reduced-motion:reduce){.c.alert,.c.go{animation:none}}
#rolbtn{width:auto;margin:0;height:44px;padding:0 14px;background:var(--c3);color:var(--ink);display:flex;gap:8px;align-items:center;font-size:12px;text-transform:uppercase}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;flex:none}.dot.on{background:var(--g);box-shadow:0 0 10px rgba(69,223,164,.8)}
.stat{display:flex;align-items:center;gap:12px;justify-content:space-between}.stat>div{flex:1}.stat b{font-size:20px;text-transform:uppercase}.stat small{display:block;opacity:.7}
.stat button{width:auto;margin:0;padding:0 16px;height:48px;display:flex;gap:6px;align-items:center;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.grid2>div{background:var(--c3);border-radius:16px;padding:12px}.grid2 small{display:block;opacity:.7;font-size:12px}
.bar{height:12px;background:var(--c4);border-radius:99px;overflow:hidden;margin-top:8px;padding:2px}.bar i{display:block;height:100%;border-radius:99px;background:var(--y);width:0;transition:width 1s}
.lbl{font:700 11px "Space Grotesk",sans-serif;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(80px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(6,14,32,.92);backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 12px rgba(0,0,0,.35)}
.bn button{width:76px;height:58px;margin:0;padding:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:20px}
.bn button.on{color:var(--y);background:rgba(251,191,36,.1)}
body[data-r=cli] #navcho,body[data-r=cho] #navcli{display:none}
.sheet{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:40;padding:0 16px}
.sheetin{max-width:560px;margin:0 auto;background:var(--c4);border-radius:24px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.85);max-height:62vh;overflow:auto}
.sheetin .c{background:var(--c3);animation:none;box-shadow:none;margin-top:8px}
.sh{display:flex;justify-content:space-between;align-items:center}.sh b{font-size:18px;color:#ffe1a7}
.tbar{height:6px;background:var(--c2);border-radius:99px;overflow:hidden;margin-top:12px}.tbar i{display:block;height:100%;background:var(--y);width:100%;transition:width 1s linear}
.c.bad{background:rgba(255,180,171,.1);box-shadow:0 0 0 2px var(--err)}
</style></head>
<body data-r="cli">
<header><div class="hb"><div class="brand"><img src="icon-192.png" alt="GPTAXI"><div><b>GPTAXI</b><small>Mototaxi</small></div></div>
</div></header>
<main>
<button id="inst" hidden style="margin:0 0 4px">📲 Instalar la app en tu celular</button>

<section id="cli">
<div id="cv-pedir">
<button id="pushc" hidden onclick="activarPush('cliente')">🔔 Activar avisos (suenan aunque la app esté cerrada)</button>
<div id="form">
<label for="n">Tu nombre</label><input id="n" autocomplete="name">
<label for="p">Referencia de recogida (opcional)</label><input id="p" placeholder="Ej: Plaza central">
<label for="d">Destino (opcional)</label><input id="d" placeholder="Ej: Hospital">
<button id="gps" onclick="miUbic()" style="height:60px;font-size:18px">📍 Enviar mi ubicación exacta</button>
<p class="s" id="gpsok">Encendé el GPS del celular y tocá el botón. Así el chofer te encuentra justo donde estás.</p>
<p class="s"><b>Después tocá en el mapa a dónde querés ir</b> (aparece una bandera 🏁).</p>
<div class="seg"><button id="mp" aria-pressed="false" onclick="setMode('p')">Cambiar recogida en el mapa</button><button id="md" aria-pressed="true" onclick="setMode('d')">Marcar destino</button></div>
<button id="go" onclick="pedir()">Pedir mototaxi</button>
</div>
<div id="ride"></div><div class="err" id="e"></div>
<div id="map"></div>
</div>
<div id="cv-motos" hidden><h2 style="margin-top:6px">Motos disponibles</h2><div id="avail"></div></div>
<div id="cv-msg" hidden><h2 style="margin-top:6px">Mensaje al administrador</h2>
<label for="mk">Tipo</label><select id="mk"><option value="mejora">Sugerencia de mejora</option><option value="queja">Queja</option></select>
<label for="mb">Tu mensaje</label><textarea id="mb" rows="4" maxlength="1000"></textarea>
<button onclick="enviarMsg()">Enviar mensaje</button><div class="err" id="mm"></div>
<button class="o" onclick="probarNotif('cliente')">Probar notificación en este celular</button></div>
</section>
</main>
<nav class="bn" id="navcli">
<button id="nc-pedir" class="on" onclick="vcli('pedir')"><span class="material-symbols-outlined">pin_drop</span>Pedir</button>
<button id="nc-motos" onclick="vcli('motos')"><span class="material-symbols-outlined">two_wheeler</span>Motos</button>
<button id="nc-msg" onclick="vcli('msg')"><span class="material-symbols-outlined">chat</span>Mensajes</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient("https://vffcjijwrgerdyujvlcf.supabase.co","sb_publishable_rv-VVSkeii8-_0pfS-EZCw_d2XkD1-Q",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const money=n=>"$"+Number(n).toLocaleString("es-AR");
async function notif(title,body,tag){try{if(!("Notification" in window)||Notification.permission!=="granted"||!("serviceWorker" in navigator))return;
const reg=await navigator.serviceWorker.ready;if(tag&&(await reg.getNotifications({tag})).length)return;
await reg.showNotification(title,{body,icon:"icon-192.png",badge:"badge-96.png",tag:tag||undefined,requireInteraction:true,lang:"es",vibrate:[600,200,600,200,600,200,900]})}catch(e){}}
const T={pendiente:"Esperando tarifa del chofer…",cotizado:"Un chofer te envió su tarifa",aceptado:"Tarifa aceptada, esperando que el chofer salga",en_camino:"El chofer va en camino a buscarte",en_viaje:"Viaje en curso",finalizado:"Viaje finalizado",cancelado:"Viaje cancelado"};
const LIVE=["pendiente","cotizado","aceptado","en_camino","en_viaje"];
/* ---------- CLIENTE ---------- */
const map=L.map("map").setView([-25.97,-54.57],14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(map);
let pin=null,dpin=null,moto=null,pick=null,dest=null,ride=null,mode="d",gps=false,acc=null;
const icon=h=>L.divIcon({className:"moto",html:h,iconSize:[30,30]});
function setMode(m){mode=m;$("mp").setAttribute("aria-pressed",m==="p");$("md").setAttribute("aria-pressed",m==="d")}
map.on("click",e=>mode==="p"?(gps=false,acc=null,setPickup(e.latlng)):setDest(e.latlng));
function setPickup(ll){pick=ll;setTimeout(saveF);if(pin)pin.setLatLng(ll);else pin=L.marker(ll).addTo(map);setMode("d")}
function setDest(ll){dest=ll;setTimeout(saveF);if(dpin)dpin.setLatLng(ll);else dpin=L.marker(ll,{icon:icon("🏁")}).addTo(map)}
function miUbic(){$("e").textContent="";const g=$("gpsok");
if(!navigator.geolocation)return $("e").textContent="Tu navegador no permite ubicación. Tocá el mapa para marcar dónde estás.";
g.textContent="Buscando tu ubicación…";
navigator.geolocation.getCurrentPosition(p=>{const ll={lat:p.coords.latitude,lng:p.coords.longitude};acc=Math.round(p.coords.accuracy);gps=true;map.setView(ll,16);setPickup(ll);
g.textContent="✅ Ubicación enviada (precisión ±"+acc+" m). Ahora tocá en el mapa a dónde vas."},
()=>{g.textContent="";$("e").textContent="No se pudo obtener tu ubicación. Activá el GPS y permití la ubicación, o cambiá la recogida en el mapa."},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
const hav=(a,b)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
async function km(a,b){try{const c=new AbortController();setTimeout(()=>c.abort(),4000);
const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`,{signal:c.signal});
return (await r.json()).routes[0].distance/1000}catch(e){return hav(a,b)*1.3}}
async function loc(ll){try{const c=new AbortController();setTimeout(()=>c.abort(),3500);
const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=es&lat=${ll.lat}&lon=${ll.lng}`,{signal:c.signal});
const a=(await r.json()).address||{};
return [a.neighbourhood||a.suburb||a.quarter,a.city||a.town||a.village||a.municipality||a.hamlet||a.county].filter(Boolean).filter((x,i,arr)=>arr.indexOf(x)===i).join(", ")}catch(e){return ""}}
try{ride=JSON.parse(store.get("ride"));$("n").value=store.get("nombre")||""}catch(e){}
async function pedir(){$("e").textContent="";
if(!pick||!dest)return $("e").textContent=pick?"Tocá en el mapa a dónde querés ir.":"Primero tocá el botón 📍 Enviar mi ubicación exacta.";
$("go").disabled=true;$("go").textContent="Calculando distancia…";
const [dk,lp,ld]=await Promise.all([km(pick,dest),loc(pick),loc(dest)]),d=Math.round(dk*10)/10,n=$("n").value.trim();
const row={client_id:cid,client_name:n,pickup_loc:lp,dropoff_loc:ld,pickup:$("p").value.trim()||"Punto en el mapa",dropoff:$("d").value.trim()||"Destino en el mapa",pickup_lat:pick.lat,pickup_lng:pick.lng,pickup_exact:gps,pickup_accuracy:acc,dropoff_lat:dest.lat,dropoff_lng:dest.lng,distance_km:d};
const {data,error}=await db.from("rides").insert(row).select().single();
$("go").disabled=false;$("go").textContent="Pedir mototaxi";
if(error)return $("e").textContent="No se pudo pedir: "+error.message;
ride=data;store.set("ride",JSON.stringify(data));if(window.Notification&&Notification.permission==="granted")activarPush("cliente",1);store.set("nombre",n);renderC()}
async function upd(u,onlyStatus){let q=db.from("rides").update(u).eq("id",ride.id);if(onlyStatus)q=q.eq("status",onlyStatus);await q;refreshC()}
const aceptar=()=>upd({status:"aceptado"},"cotizado");
const rechazar=()=>upd({status:"pendiente",driver_name:null,price:null,driver_alias:null,quoted_at:null,tariff_rejected_by:[...(ride.tariff_rejected_by||[]),ride.driver_name],event_at:new Date().toISOString()},"cotizado");
const cancelar=()=>{if(["aceptado","en_camino"].includes(ride.status)&&!confirm("¿Cancelar el viaje? Se le avisa al chofer."))return;return upd({status:"cancelado",event_at:new Date().toISOString()})};
async function refreshC(){if(!ride)return;const {data}=await db.from("rides").select().eq("id",ride.id).single();if(data){if((data.rejected_by||[]).length>(ride.rejected_by||[]).length)notif("🚫 Un chofer no pudo tomar tu viaje","Seguimos buscando otro chofer.","rej-"+data.id+"-"+(data.rejected_by||[]).length);if(data.status!==ride.status){if(data.status==="cotizado")notif("💰 Tarifa: "+money(data.price||0),(data.driver_name||"El chofer")+" te envió su tarifa. Abrí la app para aceptar.","cli-"+data.id+"-cotizado");if(data.status==="en_camino")notif("🏍️ ¡Tu mototaxi va en camino!",(data.driver_name||"El chofer")+" sale a buscarte.","cli-"+data.id+"-en_camino")}ride=data;renderC();const dn=data.driver_name;if(dn&&!(dn in motoOf)){motoOf[dn]="";db.from("drivers").select("moto").eq("name",dn).maybeSingle().then(x=>{motoOf[dn]=(x.data&&x.data.moto)||"";renderC()})}}}
function renderC(){const r=ride,live=r&&LIVE.includes(r.status);
$("form").hidden=!!live;
if(!r){$("ride").replaceChildren();return}
const c=el("div",r.status==="en_camino"?"c go":"c");c.append(el("span","st",T[r.status]),el("b",0,r.pickup+" → "+r.dropoff));
if(r.distance_km!=null)c.append(el("span",0,"Distancia aprox.: "+r.distance_km+" km"));
if(r.driver_name){c.append(el("br"),el("span",0,"Chofer: "+r.driver_name+" · "+stars(r.driver_name)))}
if(r.status==="en_camino"){c.prepend(el("b","big","🏍️ ¡Tu mototaxi va en camino!"));
const mo=motoOf[r.driver_name];if(mo)c.append(el("span",0," · Moto: "+mo));
if(r.driver_lat!=null&&r.pickup_lat!=null){const k=hav({lat:r.driver_lat,lng:r.driver_lng},{lat:r.pickup_lat,lng:r.pickup_lng});
c.append(el("b",0,"📍 A "+(k<1?Math.round(k*1000)+" m":k.toFixed(1)+" km")+" de vos · ≈ "+Math.max(1,Math.round(k/25*60))+" min"))}
else c.append(el("b",0,"El chofer salió a buscarte. Esperalo en tu punto."))}
if(r.price!=null)c.append(el("b","price","Tarifa: "+money(r.price)));
if(r.driver_alias){const al=el("div","c");al.append(el("span",0,"Alias para pagar por transferencia:"),el("b",0,r.driver_alias));const cb=el("button","o","📋 Copiar alias");
cb.onclick=async()=>{try{await navigator.clipboard.writeText(r.driver_alias);cb.textContent="✅ Copiado"}catch(e){cb.textContent="Copiá el alias a mano"}};al.append(cb);c.append(al)}
if(r.status==="pendiente"&&(r.rejected_by||[]).length){const rj=r.rejected_by,todos=availNames.length&&availNames.every(x=>rj.includes(x));
c.append(el("b",0,"🚫 "+(todos?"Ningún chofer disponible pudo tomar tu viaje":(rj.length===1?rj[0]+" no pudo tomar tu viaje":rj.length+" choferes no pudieron tomar tu viaje"))),el("span",0,todos?"Podés seguir esperando o cancelar el pedido.":"Seguimos buscando otro chofer."))}
const btn=(t,f,o)=>{const b=el("button",o?"o":0,t);b.onclick=f;c.append(b)};
if(r.status==="cotizado"){btn("Aceptar tarifa",aceptar);btn("Rechazar tarifa",rechazar,1)}
if(["pendiente","cotizado","aceptado","en_camino"].includes(r.status))btn("Cancelar pedido",cancelar,1);
if(r.status==="finalizado"){if(r.rating==null){c.append(el("p","s","Puntuá al chofer:"));const w=el("div","rt");for(let i=1;i<=5;i++){const b=el("button",0,"⭐"+i);b.onclick=()=>upd({rating:i});w.append(b)}c.append(w)}else c.append(el("p","s","Tu puntaje: ⭐ "+r.rating))}
if(!live)btn("Pedir otro viaje",()=>{ride=null;store.del("ride");renderC()});
$("ride").replaceChildren(c);
const show=live&&["aceptado","en_camino","en_viaje"].includes(r.status)&&r.driver_lat!=null;
if(show){const ll=[r.driver_lat,r.driver_lng];if(moto)moto.setLatLng(ll);else{moto=L.marker(ll,{icon:icon("🏍️")}).addTo(map);if(r.pickup_lat!=null)map.fitBounds([ll,[r.pickup_lat,r.pickup_lng]],{padding:[40,40]})}}
else if(moto){moto.remove();moto=null}}

let rat={};const motoOf={};let availNames=[];
const stars=n=>rat[n]?"⭐ "+(rat[n].s/rat[n].n).toFixed(1)+" ("+rat[n].n+")":"sin puntos aún";
async function loadA(){const [a,b]=await Promise.all([db.from("drivers").select().eq("available",true).eq("active",true).gt("last_seen",new Date(Date.now()-60000).toISOString()),db.from("rides").select("driver_name,rating").not("rating","is",null)]);
rat={};(b.data||[]).forEach(r=>{const x=rat[r.driver_name]||(rat[r.driver_name]={s:0,n:0});x.s+=r.rating;x.n++});
const d=a.data||[];availNames=d.map(x=>x.name);$("avail").replaceChildren(...(d.length?d.map(x=>{const c=el("div","c");c.append(el("b",0,x.name),el("span",0,(x.moto||"Moto sin modelo")+" · "+stars(x.name)));return c}):[el("p","s","No hay motos disponibles ahora.")]))}

async function enviarMsg(){const b=$("mb").value.trim(),m=$("mm");m.style.color="";m.textContent="";if(!b)return m.textContent="Escribí tu mensaje.";
const {error}=await db.from("messages").insert({client_name:$("n").value.trim(),kind:$("mk").value,body:b});
if(error)return m.textContent="No se pudo enviar: "+error.message;$("mb").value="";m.style.color="inherit";m.textContent="✅ Mensaje enviado. ¡Gracias!"}

/* ---------- GUARDAR LO QUE ESCRIBE EL CLIENTE ---------- */

const b64=u=>{const a=atob((u+"=".repeat((4-u.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...a].map(c=>c.charCodeAt(0)))};
function refreshPushUI(){const ok=!("Notification" in window)||Notification.permission==="granted";$("pushc").hidden=ok}

if(!("serviceWorker" in navigator)||!("PushManager" in window))return al("Este navegador no permite notificaciones. Abrí la app desde Chrome.");

if(p!=="granted")return al("No diste permiso. Activá las notificaciones de GPTAXI en los ajustes del celular.");
try{const reg=await navigator.serviceWorker.ready;
const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
const {error}=await db.rpc("save_push",{p_role:rol,p_client_id:rol==="cliente"?cid:null,p_sub:sub.toJSON()});
if(error)return al("No se pudo activar: "+error.message);al("✅ Notificaciones activadas.")}catch(e){al("No se pudo activar: "+e.message)}}
